name: Occipital npm publication

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      source-ref:
        required: true
        type: string
      targets:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: occipital-npm-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'chpock/pi-tidy-ui' && github.event_name == 'push' && github.ref == format('refs/tags/{0}', inputs.tag) && startsWith(inputs.tag, 'occipital-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
      SOURCE_COMMIT: ${{ inputs.source-ref }}
      NATIVE_TARGETS: ${{ inputs.targets }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.source-ref }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '26.7.0'
      - name: Install exact trusted-publishing npm CLI
        timeout-minutes: 5
        run: npm install --global npm@12.0.2 --ignore-scripts --no-audit --no-fund
      - name: Validate exact automatic tag publication
        id: version
        run: |
          test "$SOURCE_COMMIT" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          node scripts/release/npm-release.mjs validate-input "$TAG"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: occipital-v${{ steps.version.outputs.version }}-*
          path: .test-artifacts/npm-publish/native-artifacts
      - name: Verify the published GitHub release from this pipeline
        run: |
          mkdir -p .test-artifacts/npm-publish/public-assets
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" > .test-artifacts/npm-publish/release.json
          node scripts/release/npm-release.mjs check-release .test-artifacts/npm-publish/release.json "$TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir .test-artifacts/npm-publish/public-assets
      - name: Admit every selected package and raw public byte before packing
        run: |
          node scripts/release/npm-release.mjs prepare .test-artifacts/npm-publish/native-artifacts \
            .test-artifacts/npm-publish/public-assets "$TAG" "$SOURCE_COMMIT" .test-artifacts/npm-publish/prepared "$NATIVE_TARGETS"
      - name: Publish native packages using OIDC and verify public registry bytes
        run: node scripts/release/npm-release.mjs publish .test-artifacts/npm-publish/prepared/plan.json "$NATIVE_TARGETS"
