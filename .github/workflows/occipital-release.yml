name: Occipital release

# CI's occipital-v* tag path calls this after its versioned native matrix succeeds.
# Artifacts belong to the same workflow run and commit; no second build or lookup.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      targets:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - name: Validate exact event tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$TAG" = "$GITHUB_REF_NAME"
          node scripts/release/version.mjs --resolve "refs/tags/$TAG"
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: occipital-v${{ steps.version.outputs.version }}-*
          path: native-artifacts
      - name: Validate all platform bytes, notices, versions and source commit
        env:
          TAG: ${{ inputs.tag }}
          NATIVE_TARGETS: ${{ inputs.targets }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          node scripts/release/native-ci.mjs assemble native-artifacts "$TAG" release-assets "$NATIVE_TARGETS"
          cd release-assets
          sha256sum --check SHA256SUMS
      - name: Publish admitted assets or verify an identical completed release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/release/native-ci.mjs publish "$TAG" release-assets
