name: Occipital native CI

on:
  workflow_call:
    inputs:
      release-ref:
        required: true
        type: string
      version:
        required: true
        type: string
      clean-build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  packaging-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Assert selected Node runtime
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: node -e 'if (process.version !== "v" + process.env.EXPECTED_NODE) throw new Error(process.version)'
      - name: Inert packaging and exact-tag/commit artifact checks
        run: npm run test:native-release

  build:
    needs: packaging-fixtures
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-gnu
            runner: ubuntu-24.04
            rust: x86_64-unknown-linux-gnu
            executable: occipital
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
            rust: aarch64-unknown-linux-gnu
            executable: occipital
          - target: darwin-x64
            runner: macos-15-intel
            rust: x86_64-apple-darwin
            executable: occipital
          - target: darwin-arm64
            runner: macos-14
            rust: aarch64-apple-darwin
            executable: occipital
          - target: windows-x64-msvc
            runner: windows-2022
            rust: x86_64-pc-windows-msvc
            executable: occipital.exe
          - target: windows-arm64-msvc
            runner: windows-11-arm
            rust: aarch64-pc-windows-msvc
            executable: occipital.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # Installed package preparation also selects the nearest reachable daemon tag.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Resolve fixed Rust toolchain
        id: toolchain
        run: node scripts/release/version.mjs --toolchain
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install Windows executable inspection tool
        if: startsWith(matrix.target, 'windows-')
        run: rustup component add llvm-tools-preview
      # Match the nearest native release's embedded version even on branch CI:
      # otherwise version text alone makes an unchanged binary's checksum differ.
      - name: Stamp daemon before compilation
        env:
          DAEMON_VERSION: ${{ inputs.version }}
        run: node scripts/release/version.mjs --daemon-version "$DAEMON_VERSION"
      - uses: Swatinem/rust-cache@v2
        # The opt-in clean control proves hashes without restored compiler outputs.
        # Ordinary CI retains dependency caching and every native acceptance check.
        if: ${{ !inputs.clean-build }}
        with:
          key: ${{ startsWith(matrix.target, 'linux-') && 'glibc-2.28' || '' }}
      - run: cargo fmt --all --check
      - name: Fetch every locked build/target dependency for the notice inventory
        run: cargo fetch --locked
      # Repeated system-package installation was measurable CI overhead. Cache only
      # the public tooling image; compiler outputs and all native checks remain separate.
      # Scope it by architecture and recipe/base digest: packages refresh on recipe
      # changes, not every commit, and a different userspace must not reuse this image.
      - name: GNU tooling image cache
        id: gnu-image-cache
        if: startsWith(matrix.target, 'linux-')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/occipital-gnu-image.tar
          key: gnu-tooling-v1-${{ matrix.target }}-${{ hashFiles('scripts/release/Dockerfile.linux-gnu') }}
      - name: Restore GNU tooling image
        if: ${{ startsWith(matrix.target, 'linux-') && steps.gnu-image-cache.outputs.cache-hit == 'true' }}
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/occipital-gnu-image.tar
        run: docker load --input "$IMAGE_ARCHIVE"
      - name: GNU glibc 2.28 native build and runtime checks
        if: startsWith(matrix.target, 'linux-')
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: bash scripts/release/linux-gnu.sh "$RUST_TARGET"
      - name: Export GNU tooling image on cache miss
        if: ${{ startsWith(matrix.target, 'linux-') && steps.gnu-image-cache.outputs.cache-hit != 'true' }}
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/occipital-gnu-image.tar
          IMAGE_ARCH: ${{ matrix.target == 'linux-x64-gnu' && 'amd64' || 'arm64' }}
        run: docker save --output "$IMAGE_ARCHIVE" "occipital-gnu228-$IMAGE_ARCH"
      - name: Native correctness, pipe protocol and parser-affinity doctest
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: cargo test --workspace --locked --target "$RUST_TARGET"
      - name: Strict native lint
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: cargo clippy --workspace --all-targets --locked --target "$RUST_TARGET" -- -D warnings
      - name: Build release executable
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: cargo build --release --locked -p occipital --target "$RUST_TARGET"
      - name: Real release-binary protocol, UTF8 colors, append counters and cleanup
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          export OCCIPITAL_TEST_BIN="$GITHUB_WORKSPACE/target/$RUST_TARGET/release/$EXECUTABLE"
          node --test --test-name-pattern="^actual owned helper preserves compact UTF8 highlighting and incremental work counters$" tests/occipital-native.test.ts
      - name: Version smoke, pinned-source notices, hashes and native package staging
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          export SOURCE_COMMIT
          node scripts/release/native-ci.mjs stage "$TARGET" "target/$RUST_TARGET/release/$EXECUTABLE" "$RUNNER_TEMP/occipital-native-artifact"
      # Reuse downloaded package bodies across commits and Node versions, not installed
      # trees: clean consumers and Occipital's cold-download checks must still run.
      - name: Installed npm package cache
        if: ${{ !startsWith(inputs.release-ref, 'refs/tags/occipital-v') }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/occipital-npm-cache/_cacache
          key: installed-npm-v1-${{ matrix.target }}-${{ hashFiles('package-lock.json') }}
          restore-keys: installed-npm-v1-${{ matrix.target }}-
      # HTTP-free x64 installs were still slow in system temp (C:); paired C:/D:
      # trials showed much faster unpacking/cleanup in runner temp (D:). Use the
      # runner's directory without assuming a second drive or changing antivirus;
      # the current single-volume ARM64 runner has no measured cross-drive gain.
      # A larger Node I/O pool did not resolve unpack costs; retain the default four.
      - name: Installed adopted pin on Node 22.19.0
        if: ${{ !startsWith(inputs.release-ref, 'refs/tags/occipital-v') }}
        timeout-minutes: 15
        env:
          EXPECTED_NODE: '22.19.0'
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          npm_config_cache: ${{ runner.temp }}/occipital-npm-cache
          UV_THREADPOOL_SIZE: '4'
        run: |
          if [[ "$TARGET" == windows-* ]]; then
            TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" npm run test:installed-native
          elif [[ "$TARGET" == linux-* ]]; then
            bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET"
          else
            npm run test:installed-native
          fi
      - uses: actions/setup-node@v4
        if: ${{ !startsWith(inputs.release-ref, 'refs/tags/occipital-v') }}
        with:
          node-version: '26.7.0'
      - name: Installed adopted pin on Node 26.7.0
        if: ${{ !startsWith(inputs.release-ref, 'refs/tags/occipital-v') }}
        timeout-minutes: 15
        env:
          EXPECTED_NODE: '26.7.0'
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          npm_config_cache: ${{ runner.temp }}/occipital-npm-cache
          UV_THREADPOOL_SIZE: '4'
        run: |
          if [[ "$TARGET" == windows-* ]]; then
            TEMP="$RUNNER_TEMP" TMP="$RUNNER_TEMP" npm run test:installed-native
          elif [[ "$TARGET" == linux-* ]]; then
            bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET"
          else
            npm run test:installed-native
          fi
      # Keep safe success metrics too: a cache hit alone did not explain slow installs.
      - name: Installed npm preparation diagnostics
        if: ${{ always() && !startsWith(inputs.release-ref, 'refs/tags/occipital-v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installed-preparation-${{ matrix.target }}
          path: .test-artifacts/installed-preparation-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: occipital-v${{ inputs.version }}-${{ matrix.target }}
          path: ${{ runner.temp }}/occipital-native-artifact/
          if-no-files-found: error
          retention-days: 14
