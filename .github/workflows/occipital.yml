name: Occipital native CI

on:
  workflow_call:
    inputs:
      release-ref:
        required: true
        type: string
      version:
        required: true
        type: string
      source-ref:
        type: string
        default: ''
      targets:
        type: string
        default: all
      consumers:
        type: boolean
        default: true
      clean-build:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - id: targets
        env:
          TARGETS: ${{ inputs.targets }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {nativeTargets} from './scripts/test/ci-scope.mjs';
          appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify(nativeTargets(process.env.TARGETS,process.env.RELEASE_REF)) + '\n');
          JS
  packaging-fixtures:
    if: inputs.consumers || startsWith(inputs.release-ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Assert selected Node runtime
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: node -e 'if (process.version !== "v" + process.env.EXPECTED_NODE) throw new Error(process.version)'
      - name: Prepare enforced Linux network isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true; then
            sudo tee /etc/apparmor.d/tidy-test-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tidy-test-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/tidy-test-bwrap
          fi
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Inert packaging and exact-tag/commit artifact checks
        run: |
          node scripts/test/prepare.mjs --pi-version 1.0.0 --output "$RUNNER_TEMP/release-inputs"
          node scripts/test/run.mjs --inputs "$RUNNER_TEMP/release-inputs/inputs.json" --suite native-release --network-isolated

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_AUTO_INSTALL: '0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-ref || github.sha }}
          # Installed package preparation also selects the nearest reachable daemon tag.
          fetch-depth: 0
      - name: Declare Windows checkout line-ending semantics
        if: runner.os == 'Windows'
        run: |
          git config --local core.autocrlf true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - name: Resolve fixed Rust toolchain
        id: toolchain
        run: node scripts/release/version.mjs --toolchain
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}
          targets: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: Install Windows executable inspection tool
        if: startsWith(matrix.target, 'windows-')
        run: rustup component add llvm-tools-preview
      - name: Declare pinned compiler and hosted setup Cargo artifact store
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync, lstatSync, mkdirSync, realpathSync} from 'node:fs';
          import {userInfo} from 'node:os';
          import {dirname, isAbsolute, join, relative, resolve, sep} from 'node:path';
          if (process.env.GITHUB_ACTIONS !== 'true' || process.env.RUNNER_ENVIRONMENT !== 'github-hosted') throw new Error('Setup Cargo store requires disposable hosted CI');
          // rust-toolchain declares CARGO_HOME via GITHUB_ENV, including the native Windows default.
          // Keep that exact build-visible path: dependency source paths can survive release stripping.
          const home = process.env.CARGO_HOME, setupHome = process.platform === 'win32' ? process.env.USERPROFILE : process.env.HOME, temp = process.env.RUNNER_TEMP;
          for (const path of [home, setupHome, temp, process.env.GITHUB_ENV]) {
            if (!path || !isAbsolute(path) || /[\r\n]/.test(path) || (process.platform === 'win32' && !/^[A-Za-z]:[\\/]/.test(path))) throw new Error('Missing or unsafe native setup store path');
          }
          const inside = (root, path) => { const suffix = relative(root, path); return suffix && suffix !== '..' && !suffix.startsWith('..' + sep) && !isAbsolute(suffix); };
          const store = resolve(home), profile = resolve(setupHome), temporary = resolve(temp);
          const root = relative(join(profile,'.cargo'), store) === '' ? profile : inside(temporary,store) ? temporary : undefined;
          if (!root) throw new Error('Setup Cargo store is outside allowed tool-setup roots');
          if (process.platform === 'win32' && relative(realpathSync(userInfo().homedir),realpathSync(profile)) !== '') throw new Error('Setup profile is not owned by the hosted account');
          const ownedDirectory = path => {
            const info = lstatSync(path);
            if (dirname(path) === path || !info.isDirectory() || info.isSymbolicLink() || (process.platform !== 'win32' && (info.uid !== process.getuid() || (info.mode & 0o022)))) throw new Error('Setup Cargo store is not an owned safe directory');
          };
          ownedDirectory(temporary);
          for (let path = root;;) {
            ownedDirectory(path);
            if (relative(path,store) === '') break;
            path = join(path, relative(path,store).split(sep)[0]);
          }
          for (const name of ['config.toml','config','credentials.toml','credentials']) {
            if (lstatSync(join(store,name), {throwIfNoEntry:false})) throw new Error('Setup Cargo store contains unexpected configuration or credentials');
          }
          mkdirSync(join(temp,'native-environment'), {recursive:true});
          const compiler = execFileSync('rustc',['--print','sysroot'], {encoding:'utf8'}).trim();
          appendFileSync(process.env.GITHUB_ENV, `CARGO_HOME=${home}\nRUST_ROOT=${compiler}\nNODE=${process.execPath}\n`);
          JS
      - uses: actions/cache@v4
        if: ${{ !inputs.clean-build }}
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
            target
          key: hermetic-native-v1-${{ matrix.target }}-${{ inputs.version }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Prepare explicit build-only MSVC context
        if: startsWith(matrix.target, 'windows-')
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {writeFileSync} from 'node:fs';
          import {join} from 'node:path';
          const system = 'C:\\Windows';
          const vswhere = 'C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe';
          const installation = execFileSync(vswhere, ['-latest', '-products', '*', '-requires', 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64', '-property', 'installationPath'], {encoding:'utf8'}).trim();
          const cpu = process.env.RUST_TARGET.startsWith('aarch64-') ? 'arm64' : 'x64';
          const output = execFileSync(join(system, 'System32/cmd.exe'), ['/d', '/s', '/c', `""${join(installation, 'VC/Auxiliary/Build/vcvarsall.bat')}" ${cpu === 'arm64' ? 'x64_arm64' : 'x64'} >nul && set"`], {encoding:'utf8', windowsVerbatimArguments:true});
          const vars = Object.fromEntries(output.split(/\r?\n/).filter(row=>row.includes('=')).map(row=>[row.slice(0,row.indexOf('=')),row.slice(row.indexOf('=')+1)]));
          const environment = {PATH: [join(vars.VCToolsInstallDir, 'bin/Hostx64', cpu), join(vars.WindowsSdkDir, 'bin', vars.WindowsSDKVersion.replace(/[\\/]+$/, ''), 'x64'), join(system,'System32'), 'C:\\Program Files\\Git\\usr\\bin', join(process.env.RUST_ROOT,'bin')].join(';'), INCLUDE:vars.INCLUDE, LIB:vars.LIB, LIBPATH:vars.LIBPATH};
          if (Object.values(environment).some(value=>!value)) throw new Error('Incomplete provisioned MSVC environment');
          writeFileSync(join(process.env.RUNNER_TEMP, 'native-environment/msvc.json'), JSON.stringify(environment));
          JS
      - name: Declare provisioned Windows runtime tools
        if: startsWith(matrix.target, 'windows-')
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync, existsSync} from 'node:fs';
          import {dirname, join} from 'node:path';
          const tools = {git:'C:/Program Files/Git/cmd/git.exe', bash:'C:/Program Files/Git/bin/bash.exe', tar:'C:/Windows/System32/tar.exe', npm:join(dirname(process.execPath),'node_modules/npm/bin/npm-cli.js')};
          if(Object.values(tools).some(path=>!existsSync(path))) throw new Error('Missing provisioned Windows runtime tool');
          writeFileSync(join(process.env.RUNNER_TEMP,'runtime-tools.json'),JSON.stringify(tools));
          JS
      - name: Prepare neutral native source snapshot
        run: |
          tools_args=()
          if [[ -f "$RUNNER_TEMP/runtime-tools.json" ]]; then tools_args=(--tools "$RUNNER_TEMP/runtime-tools.json" --rust-environment "$RUNNER_TEMP/native-environment/msvc.json"); fi
          node scripts/test/prepare.mjs --pi-version 1.0.0 --rust-root "$RUST_ROOT" --cargo-cache "$CARGO_HOME" \
            "${tools_args[@]}" --output "$RUNNER_TEMP/native-build-inputs"
          # shellcheck disable=SC2016
          node --input-type=module -e 'import {readFileSync,appendFileSync} from "node:fs"; import {join} from "node:path"; const inputs=JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,"native-build-inputs/inputs.json"))); appendFileSync(process.env.GITHUB_ENV,`NATIVE_SOURCE=${inputs.pi.root}\n`);'
      - name: Fetch locked native dependencies with owned config
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {childEnv} from './scripts/test/context.mjs';
          import {readFileSync, existsSync} from 'node:fs';
          import {join, delimiter} from 'node:path';
          const root = process.env.RUST_ROOT, home = process.env.CARGO_HOME, state = join(process.env.RUNNER_TEMP,'native-environment');
          const msvc = join(state,'msvc.json');
          const build = existsSync(msvc) ? JSON.parse(readFileSync(msvc)) : {};
          const inputs = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'native-build-inputs/inputs.json')));
          const env = childEnv(join(inputs.runRoot,'native-runtime'), {...build, PATH:[join(root,'bin'),build.PATH,inputs.tools.path ?? inputs.tools.bin].filter(Boolean).join(delimiter), CARGO_HOME:home, CARGO_TARGET_DIR:process.env.CARGO_TARGET_DIR, RUSTC:join(root,'bin',process.platform==='win32'?'rustc.exe':'rustc'), RUSTUP_AUTO_INSTALL:'0', RUSTUP_TOOLCHAIN:root}, inputs);
          const result = spawnSync(join(root,'bin',process.platform==='win32'?'cargo.exe':'cargo'), ['fetch','--locked'], {cwd:process.env.NATIVE_SOURCE,env,stdio:'inherit'});
          if(result.status!==0) process.exit(result.status ?? 1);
          JS
      # Stamp only the neutral snapshot; commit-only artifact admission retains a clean checkout.
      - name: Stamp daemon before compilation
        env:
          DAEMON_VERSION: ${{ inputs.version }}
        run: node --input-type=module -e 'import {stampDaemonVersion} from "./scripts/release/version.mjs"; await stampDaemonVersion(process.env.NATIVE_SOURCE, process.env.DAEMON_VERSION);'
      # Repeated system-package installation was measurable CI overhead. Cache only
      # the public tooling image; compiler outputs and all native checks remain separate.
      # Scope it by architecture and recipe/base digest: packages refresh on recipe
      # changes, not every commit, and a different userspace must not reuse this image.
      - name: GNU tooling image cache
        id: gnu-image-cache
        if: startsWith(matrix.target, 'linux-')
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/occipital-gnu-image.tar
          key: gnu-tooling-v1-${{ matrix.target }}-${{ hashFiles('scripts/release/Dockerfile.linux-gnu') }}
      - name: Restore GNU tooling image
        if: ${{ startsWith(matrix.target, 'linux-') && steps.gnu-image-cache.outputs.cache-hit == 'true' }}
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/occipital-gnu-image.tar
        run: docker load --input "$IMAGE_ARCHIVE"
      - name: GNU glibc 2.28 native build and runtime checks
        if: startsWith(matrix.target, 'linux-')
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: bash "$NATIVE_SOURCE/scripts/release/linux-gnu.sh" "$RUST_TARGET"
      - name: Export GNU tooling image on cache miss
        if: ${{ startsWith(matrix.target, 'linux-') && steps.gnu-image-cache.outputs.cache-hit != 'true' }}
        env:
          IMAGE_ARCHIVE: ${{ runner.temp }}/occipital-gnu-image.tar
          IMAGE_ARCH: ${{ matrix.target == 'linux-x64-gnu' && 'amd64' || 'arm64' }}
        run: docker save --output "$IMAGE_ARCHIVE" "occipital-gnu228-$IMAGE_ARCH"
      - name: Offline native correctness, strict lint and release build
        if: ${{ !startsWith(matrix.target, 'linux-') }}
        env:
          RUST_TARGET: ${{ matrix.rust }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {childEnv} from './scripts/test/context.mjs';
          import {readFileSync, existsSync} from 'node:fs';
          import {join, delimiter} from 'node:path';
          const root = process.env.RUST_ROOT, state = join(process.env.RUNNER_TEMP,'native-environment');
          const inputs = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'native-build-inputs/inputs.json')));
          const msvc = join(state,'msvc.json'), build = existsSync(msvc) ? JSON.parse(readFileSync(msvc)) : {};
          const env = childEnv(join(inputs.runRoot,'native-runtime'), {...build, PATH:[join(root,'bin'),build.PATH,inputs.tools.path ?? inputs.tools.bin].filter(Boolean).join(delimiter), CARGO_HOME:process.env.CARGO_HOME, CARGO_TARGET_DIR:process.env.CARGO_TARGET_DIR, CARGO_NET_OFFLINE:'true', RUSTC:join(root,'bin',process.platform==='win32'?'rustc.exe':'rustc'), RUSTUP_AUTO_INSTALL:'0', RUSTUP_TOOLCHAIN:root}, inputs);
          const cargo = join(root,'bin',process.platform==='win32'?'cargo.exe':'cargo'), target = process.env.RUST_TARGET;
          for (const args of [['fmt','--all','--check'], ['test','--workspace','--locked','--offline','--target',target], ['clippy','--workspace','--all-targets','--locked','--offline','--target',target,'--','-D','warnings'], ['build','--release','--locked','--offline','-p','occipital','--target',target]]) {
            const result = spawnSync(cargo,args,{cwd:process.env.NATIVE_SOURCE,env,stdio:'inherit'}); if(result.status!==0) process.exit(result.status ?? 1);
          }
          JS
      - name: Version smoke, pinned-source notices, hashes and native package staging
        env:
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {join, delimiter} from 'node:path';
          import {childEnv} from './scripts/test/context.mjs';
          import {stageCI} from './scripts/release/native-ci.mjs';
          const inputs = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'native-build-inputs/inputs.json')));
          const root = process.env.NATIVE_SOURCE, target = process.env.TARGET;
          const binary = join(process.env.CARGO_TARGET_DIR,process.env.RUST_TARGET,'release',process.env.EXECUTABLE);
          const output = join(process.env.RUNNER_TEMP,'occipital-native-artifact'), repository = process.env.GITHUB_REPOSITORY;
          const env = childEnv(join(inputs.runRoot,'staging'), {...inputs.rust.environment,
            PATH:[join(inputs.rust.root,'bin'),inputs.rust.environment?.PATH,inputs.tools.path ?? inputs.tools.bin].filter(Boolean).join(delimiter),
            CARGO_HOME:process.env.CARGO_HOME, RUSTC:inputs.rust.rustc, RUSTUP_AUTO_INSTALL:'0', RUSTUP_TOOLCHAIN:inputs.rust.root, CARGO_NET_OFFLINE:'true'}, inputs);
          for (const key of Object.keys(process.env)) delete process.env[key];
          Object.assign(process.env,env);
          await stageCI({root,target,binary,output,repository,commit:inputs.source.commit});
          JS
      - name: Verify original source identity after neutral staging
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          import {childEnv} from './scripts/test/context.mjs';
          import {sourceIdentity} from './scripts/test/prepare.mjs';
          const inputs = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP,'native-build-inputs/inputs.json')));
          const source = sourceIdentity(inputs.source.root,inputs.tools,childEnv(join(inputs.runRoot,'identity'),{},inputs));
          if (source.commit !== inputs.source.commit || source.tree !== inputs.source.tree) throw new Error('Native build modified the tested checkout');
          JS
      - name: Prepare enforced Linux network isolation
        if: startsWith(matrix.target, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true; then
            sudo tee /etc/apparmor.d/tidy-test-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tidy-test-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/tidy-test-bwrap
          fi
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Same-commit clean consumer and actual helper on Node 22.19.0
        if: inputs.consumers || startsWith(inputs.release-ref, 'refs/tags/')
        timeout-minutes: 15
        env:
          EXPECTED_NODE: '22.19.0'
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          NODE="$(node -p 'process.execPath')"
          PREPARATION="$RUNNER_TEMP/consumer-22.19.0"
          ARTIFACT="$RUNNER_TEMP/occipital-native-artifact"
          tools_args=()
          if [[ "$TARGET" == windows-* ]]; then tools_args=(--tools "$RUNNER_TEMP/runtime-tools.json" --rust-environment "$RUNNER_TEMP/native-environment/msvc.json"); fi
          node scripts/test/prepare.mjs --pi-version 1.0.0 --archives --native-artifact "$ARTIFACT" --rust-root "$RUST_ROOT" --cargo-cache "$CARGO_HOME" "${tools_args[@]}" --output "$PREPARATION"
          isolation_args=()
          if [[ "$TARGET" == linux-* ]]; then isolation_args=(--network-isolated); fi
          node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite rust-harness "${isolation_args[@]}"
          if [[ "$TARGET" == linux-* ]]; then
            NODE="$NODE" bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET" native "$PREPARATION" "$ARTIFACT"
            NODE="$NODE" bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET" consumer "$PREPARATION" "$ARTIFACT"
          else
            node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite native --files occipital-native.test.ts --pattern '^actual owned helper preserves compact UTF8 highlighting and incremental work counters$'
            node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite consumer
          fi
      - name: Published delivery on Node 22.19.0 (pi-tidy-ui release only)
        if: startsWith(inputs.release-ref, 'refs/tags/pi-tidy-ui-v')
        timeout-minutes: 15
        env:
          EXPECTED_NODE: '22.19.0'
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          PREPARATION="$RUNNER_TEMP/consumer-22.19.0"
          ARTIFACT="$RUNNER_TEMP/occipital-native-artifact"
          if [[ "$TARGET" == linux-* ]]; then
            NODE="$(node -p 'process.execPath')" bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET" published-consumer "$PREPARATION" "$ARTIFACT" "$RELEASE_REF"
          else
            node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite published-consumer --release-ref "$RELEASE_REF"
          fi
      - uses: actions/setup-node@v4
        if: inputs.consumers || startsWith(inputs.release-ref, 'refs/tags/')
        with:
          node-version: '26.7.0'
      - name: Declare provisioned Windows runtime tools
        if: startsWith(matrix.target, 'windows-') && (inputs.consumers || startsWith(inputs.release-ref, 'refs/tags/'))
        run: |
          node --input-type=module <<'JS'
          import {writeFileSync, existsSync} from 'node:fs';
          import {dirname, join} from 'node:path';
          const tools = {git:'C:/Program Files/Git/cmd/git.exe', bash:'C:/Program Files/Git/bin/bash.exe', tar:'C:/Windows/System32/tar.exe', npm:join(dirname(process.execPath),'node_modules/npm/bin/npm-cli.js')};
          if(Object.values(tools).some(path=>!existsSync(path))) throw new Error('Missing provisioned Windows runtime tool');
          writeFileSync(join(process.env.RUNNER_TEMP,'runtime-tools.json'),JSON.stringify(tools));
          JS
      - name: Same-commit clean consumer and actual helper on Node 26.7.0
        if: inputs.consumers || startsWith(inputs.release-ref, 'refs/tags/')
        timeout-minutes: 15
        env:
          EXPECTED_NODE: '26.7.0'
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          NODE="$(node -p 'process.execPath')"
          PREPARATION="$RUNNER_TEMP/consumer-26.7.0"
          ARTIFACT="$RUNNER_TEMP/occipital-native-artifact"
          tools_args=()
          if [[ "$TARGET" == windows-* ]]; then tools_args=(--tools "$RUNNER_TEMP/runtime-tools.json" --rust-environment "$RUNNER_TEMP/native-environment/msvc.json"); fi
          node scripts/test/prepare.mjs --pi-version 1.0.0 --archives --native-artifact "$ARTIFACT" --rust-root "$RUST_ROOT" --cargo-cache "$CARGO_HOME" "${tools_args[@]}" --output "$PREPARATION"
          isolation_args=()
          if [[ "$TARGET" == linux-* ]]; then isolation_args=(--network-isolated); fi
          node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite rust-harness "${isolation_args[@]}"
          if [[ "$TARGET" == linux-* ]]; then
            NODE="$NODE" bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET" native "$PREPARATION" "$ARTIFACT"
            NODE="$NODE" bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET" consumer "$PREPARATION" "$ARTIFACT"
          else
            node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite native --files occipital-native.test.ts --pattern '^actual owned helper preserves compact UTF8 highlighting and incremental work counters$'
            node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite consumer
          fi
      - name: Published delivery on Node 26.7.0 (pi-tidy-ui release only)
        if: startsWith(inputs.release-ref, 'refs/tags/pi-tidy-ui-v')
        timeout-minutes: 15
        env:
          EXPECTED_NODE: '26.7.0'
          TARGET: ${{ matrix.target }}
          RUST_TARGET: ${{ matrix.rust }}
          RELEASE_REF: ${{ inputs.release-ref }}
        run: |
          PREPARATION="$RUNNER_TEMP/consumer-26.7.0"
          ARTIFACT="$RUNNER_TEMP/occipital-native-artifact"
          if [[ "$TARGET" == linux-* ]]; then
            NODE="$(node -p 'process.execPath')" bash scripts/release/installed-linux-gnu.sh "$RUST_TARGET" published-consumer "$PREPARATION" "$ARTIFACT" "$RELEASE_REF"
          else
            node scripts/test/run.mjs --inputs "$PREPARATION/inputs.json" --suite published-consumer --release-ref "$RELEASE_REF"
          fi
      - name: Retain only safe consumer diagnostics from neutral sources
        if: always()
        run: |
          node --input-type=module <<'JS'
          import {cpSync,existsSync,mkdirSync,readFileSync,readdirSync} from 'node:fs';
          import {join} from 'node:path';
          for (const version of ['22.19.0','26.7.0']) {
            const preparation = join(process.env.RUNNER_TEMP,'consumer-' + version), receipt = join(preparation,'inputs.json');
            if (!existsSync(receipt)) continue;
