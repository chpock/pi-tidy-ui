name: Intel native performance diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-performance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.daemon_version }}
      platforms: ${{ steps.platform.outputs.platforms }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/release/version.mjs --resolve "$RELEASE_REF"
      - name: Select existing Intel target
        id: platform
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {platforms} from './scripts/release/platforms.mjs';
          const selected=platforms.filter(platform=>platform.target==='darwin-x64');
          if(selected.length!==1||selected[0].enabled===false)throw Error('An enabled Intel target is required');
          appendFileSync(process.env.GITHUB_OUTPUT,'platforms='+JSON.stringify(selected)+'\n');
          JS
  compare:
    needs: metadata
    uses: ./.github/workflows/occipital.yml
    with:
      source-ref: ${{ github.sha }}
      release-ref: ${{ github.ref }}
      version: ${{ needs.metadata.outputs.version }}
      platforms: ${{ needs.metadata.outputs.platforms }}
      diagnostic-incremental-comparison: true
