name: CI

on:
  push:
    branches: [main]
    tags: ['pi-tidy-ui-v*', 'occipital-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: 'Full supported compatibility and enabled-platform acceptance (cannot narrow releases)'
        type: boolean
        default: true
      add-features:
        description: 'Additive comma-separated contract groups'
        type: string
      scope-head:
        description: 'Exact tested HEAD for authorized manual feature scope'
        type: string
      base-sha:
        description: 'Exact base commit for manual feature scope'
        type: string
      features:
        description: 'Reviewed manual feature groups (full=false only)'
        type: string
      rationale:
        description: 'Reviewed contract rationale for manual feature scope'
        type: string
      compatibility:
        description: 'Add affected Pi/Node profiles; never subtract conservative obligations'
        type: choice
        default: baseline
        options: [baseline, pi, node, all]
      execute-conservative:
        description: 'Authorize the conservative union with a budget exception'
        type: boolean
        default: false
      windows-only:
        description: 'Manual Windows consumer diagnostic only (requires full=false and exact scope-head; never release acceptance)'
        type: boolean
        default: false
      clean-native-build:
        description: 'Build every native target without restoring Cargo outputs (reproducibility control)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.version.outputs.product }}
      version: ${{ steps.version.outputs.version }}
      daemon_version: ${{ steps.version.outputs.daemon_version }}
      daemon_tag: ${{ steps.version.outputs.daemon_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The nearest daemon version comes from ancestry, not registry/latest.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/release/version.mjs --resolve "$RELEASE_REF"
      - name: Validate automatic native npm version before building
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import {npmReleaseTag} from './scripts/release/version.mjs';
          npmReleaseTag(process.env.RELEASE_REF.slice('refs/tags/'.length));
          JS
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12

  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      status: ${{ steps.scope.outputs.status }}
      full: ${{ steps.scope.outputs.full }}
      head: ${{ steps.scope.outputs.head }}
      features: ${{ steps.scope.outputs.features }}
      profiles: ${{ steps.scope.outputs.profiles }}
      compatibility_profiles: ${{ steps.scope.outputs.compatibility_profiles }}
    steps:
      # For PR metadata, execute only the trusted base router, never PR code.
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - name: Fetch diff objects without executing changed code
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base-sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then git fetch --no-tags origin "$BASE_SHA"; fi
      - uses: actions/github-script@v9.0.0
        id: scope
        env:
          SCOPE_INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const {githubScope} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/test/ci-scope.mjs`);
            const {featurePlan} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/test/catalog.mjs`);
            const result = await githubScope({api:(route,params)=>github.request(route,params),eventName:context.eventName,payload:context.payload,ref:context.ref,commit:context.sha,actor:context.actor,inputs:JSON.parse(process.env.SCOPE_INPUTS),featurePlan});
            const minimum = '1.0.0';
            const needsLatest = result.status === 'ready' &&
              (result.full && result.releaseKind !== 'daemon' || result.runAffected && result.affectedProfiles.some(profile => profile.pi !== minimum));
            let latest = null;
            if (needsLatest) {
              const {parseVersion} = await import(`${process.env.GITHUB_WORKSPACE}/src/occipital/version.ts`);
              const response = await fetch('https://registry.npmjs.org/@earendil-works%2Fpi-coding-agent/latest', {redirect:'error',signal:AbortSignal.timeout(30000)});
              if (!response.ok) throw new Error('Pi latest metadata HTTP status ' + response.status);
              const metadata = await response.json();
              if (metadata?.name !== '@earendil-works/pi-coding-agent') throw new Error('Unexpected Pi latest package identity');
              const parsed = parseVersion(metadata.version);
              if (!parsed || metadata.version.includes('+')) throw new Error('Expected an exact npm Pi version');
              const [major,minor,patch] = metadata.version.split('-')[0].split('.').map(BigInt);
              if (major < 1n || major === 1n && minor === 0n && patch === 0n && parsed.prerelease) throw new Error('Pi latest is below minimum 1.0.0');
              latest = metadata.version;
              // Migrate non-minimum profiles from older trusted-base routers too.
              const baselineCovered = !result.full && !result.affectedProfiles.some(profile => profile.node === '22.19.0' && profile.pi === minimum);
              const pin = profiles => [...new Map(profiles.map(profile => {
                const pinned = {...profile,pi:profile.pi === minimum ? minimum : latest};
                return [pinned.node + '/' + pinned.pi,pinned];
              })).values()];
              result.profiles = pin(result.profiles);
              result.affectedProfiles = pin(result.affectedProfiles).filter(profile => !(baselineCovered && profile.node === '22.19.0' && profile.pi === minimum));
              result.runAffected &&= result.affectedProfiles.length > 0;
            }
            result.piSelection = {minimum,latest};
            core.setOutput('compatibility_profiles',JSON.stringify({include:result.profiles}));
            core.setOutput('scope',JSON.stringify(result));
            for (const key of ['status','full','head']) core.setOutput(key,String(result[key]));
            core.setOutput('features',result.features.join(','));
            core.setOutput('profiles',JSON.stringify({include:result.affectedProfiles}));
            console.log('Contract scope: ' + JSON.stringify(result));

  scope-decision:
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require a resolved scope before expensive acceptance
        env:
          STATUS: ${{ needs.scope.outputs.status }}
        run: test "$STATUS" = ready

  baseline:
    needs: [version, scope]
    if: needs.scope.outputs.full != 'true' && fromJSON(needs.scope.outputs.scope).selection != 'windows-consumer-diagnostic' && needs.version.outputs.product != 'occipital'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/scoped-inputs/environment/cache/npm/_cacache
          key: hermetic-npm-inputs-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Prepare enforced Linux network isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true; then
            sudo tee /etc/apparmor.d/tidy-test-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tidy-test-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/tidy-test-bwrap
          fi
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Prepare only baseline capabilities
        run: node scripts/test/prepare.mjs --pi-version 1.0.0 --output "$RUNNER_TEMP/scoped-inputs"
      - name: Types, product SDK and physical smoke without native dependencies
        env:
          FEATURES: ${{ join(fromJSON(needs.scope.outputs.scope).baselineFeatures, ',') }}
        run: node scripts/test/feature.mjs --inputs "$RUNNER_TEMP/scoped-inputs/inputs.json" --features "$FEATURES" --output "$RUNNER_TEMP/baseline-receipts" --network-isolated

  affected:
    needs: [version, scope, native-linux]
    if: >-
      always() && needs.version.result == 'success' && needs.scope.result == 'success' &&
      needs.scope.outputs.status == 'ready' && fromJSON(needs.scope.outputs.scope).runAffected &&
      (needs.native-linux.result == 'success' || needs.native-linux.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.profiles) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/scoped-inputs/environment/cache/npm/_cacache
          key: hermetic-npm-inputs-${{ runner.os }}-${{ runner.arch }}-affected-pi-${{ matrix.pi }}-integration-${{ fromJSON(needs.scope.outputs.scope).capabilities.integration }}-shared-${{ fromJSON(needs.scope.outputs.scope).capabilities.shared }}-${{ hashFiles('package-lock.json', 'tests/fixtures/integration-profile/package-lock.json') }}
      - uses: actions/download-artifact@v8.0.2
        if: fromJSON(needs.scope.outputs.scope).capabilities.native
        with:
          name: occipital-v${{ needs.version.outputs.daemon_version }}-linux-x64-gnu
          path: .test-artifacts/ci-native
      - name: Admit executable mode for selected current-source helper
        if: fromJSON(needs.scope.outputs.scope).capabilities.native
        run: chmod +x .test-artifacts/ci-native/packages/linux-x64-gnu/occipital
      - name: Prepare enforced Linux network isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true; then
            sudo tee /etc/apparmor.d/tidy-test-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tidy-test-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/tidy-test-bwrap
          fi
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Prepare fixed isolated Subconscious host prerequisite
        if: fromJSON(needs.scope.outputs.scope).capabilities.shared
        run: |
          mkdir -p "$RUNNER_TEMP/shared-host"
          curl --fail --location --output "$RUNNER_TEMP/shared-host/host.zip" \
            https://github.com/cortexkit/subconscious/releases/download/subc-core-v0.20.83/ck-subc-linux-x64.zip
          printf '%s  %s\n' c905fd8c5eba045c38fb61dd0c6c0ffc8254ae2cb0be50ef1017cde5470e62c4 "$RUNNER_TEMP/shared-host/host.zip" | sha256sum --check
          unzip -j "$RUNNER_TEMP/shared-host/host.zip" ck-subc -d "$RUNNER_TEMP/shared-host"
          chmod 700 "$RUNNER_TEMP/shared-host/ck-subc"
      - name: Prepare selected capabilities from the scope record
        env:
          SCOPE: ${{ needs.scope.outputs.scope }}
          PI_VERSION: ${{ matrix.pi }}
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          const scope = JSON.parse(process.env.SCOPE), args = ['scripts/test/prepare.mjs','--pi-version',process.env.PI_VERSION,'--output',process.env.RUNNER_TEMP + '/scoped-inputs'];
          if (scope.capabilities.native) args.push('--native-artifact',process.env.GITHUB_WORKSPACE + '/.test-artifacts/ci-native');
          if (scope.capabilities.shared) args.push('--shared-host',process.env.RUNNER_TEMP + '/shared-host/ck-subc');
          if (scope.capabilities.integration) args.push('--integration');
          // Registry/Rust/platform obligations run in the reusable native workflow.
          const result = spawnSync(process.execPath,args,{stdio:'inherit'}); process.exit(result.status ?? 1);
          JS
      - name: Affected contracts on required host and runtime profiles
        env:
          FEATURES: ${{ needs.scope.outputs.features }}
          CHECK_TYPES: ${{ matrix.pi != '1.0.0' && needs.version.outputs.product != 'occipital' }}
        run: |
          args=()
          if [[ "$CHECK_TYPES" == true ]]; then args+=(--check-types); fi
          node scripts/test/feature.mjs --inputs "$RUNNER_TEMP/scoped-inputs/inputs.json" --features "$FEATURES" --affected-only "${args[@]}" --output "$RUNNER_TEMP/affected-receipts" --network-isolated

  native-plan:
    needs: [version, scope]
    if: needs.scope.outputs.status == 'ready' && fromJSON(needs.scope.outputs.scope).capabilities.native
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      host: ${{ steps.plan.outputs.host }}
      remaining: ${{ steps.plan.outputs.remaining }}
      host-consumers: ${{ steps.plan.outputs.hostConsumers }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - id: plan
        env:
          TARGET_SCOPE: ${{ fromJSON(needs.scope.outputs.scope).platforms }}
          RELEASE_REF: ${{ github.ref }}
          CONSUMERS: ${{ fromJSON(needs.scope.outputs.scope).consumers }}
          WINDOWS_ARM64: ${{ vars.CI_WINDOWS_ARM64 || 'false' }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {nativePlan} from './scripts/test/ci-scope.mjs';
          if (!['true','false'].includes(process.env.WINDOWS_ARM64)) throw new Error('CI_WINDOWS_ARM64 must be true or false');
          const plan = nativePlan(process.env.TARGET_SCOPE,process.env.RELEASE_REF,process.env.CONSUMERS === 'true',{windowsArm64:process.env.WINDOWS_ARM64 === 'true'});
          for (const key of ['host','remaining','hostConsumers','targets']) appendFileSync(process.env.GITHUB_OUTPUT,key + '=' + JSON.stringify(plan[key]) + '\n');
          console.log('Selected native obligations: ' + JSON.stringify(plan));
          JS

  native-linux:
    needs: [version, scope, native-plan]
    if: needs.native-plan.outputs.host != '[]'
    uses: ./.github/workflows/occipital.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.version.outputs.daemon_version }}
      source-ref: ${{ needs.scope.outputs.head }}
      clean-build: ${{ inputs.clean-native-build || false }}
      platforms: ${{ needs.native-plan.outputs.host }}

  native-platforms:
    needs: [version, scope, native-plan]
    if: needs.native-plan.outputs.remaining != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.native-plan.outputs.remaining) }}
    uses: ./.github/workflows/occipital-platform.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.version.outputs.daemon_version }}
      source-ref: ${{ needs.scope.outputs.head }}
      clean-build: ${{ inputs.clean-native-build || false }}
      platform: ${{ toJSON(matrix) }}
      consumer-platforms: ${{ toJSON(matrix.consumerMatrix) }}

  consumer-linux:
    needs: [version, scope, native-plan, native-linux]
    if: needs.native-plan.outputs.host-consumers != '[]'
    uses: ./.github/workflows/occipital-consumer.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.version.outputs.daemon_version }}
      source-ref: ${{ needs.scope.outputs.head }}
      platforms: ${{ needs.native-plan.outputs.host-consumers }}

  extension:
    needs: [version, native-linux, scope]
    if: needs.scope.outputs.full == 'true' && needs.version.outputs.product != 'occipital'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.compatibility_profiles) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/extension-inputs/environment/cache/npm/_cacache
          key: hermetic-npm-inputs-${{ runner.os }}-${{ runner.arch }}-pi-${{ matrix.pi }}-${{ hashFiles('package-lock.json', 'tests/fixtures/integration-profile/package-lock.json') }}
      - name: Assert selected Node runtime
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: node -e 'if (process.version !== "v" + process.env.EXPECTED_NODE) throw new Error(process.version)'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: occipital-v${{ needs.version.outputs.daemon_version }}-linux-x64-gnu
          path: .test-artifacts/ci-native
      - name: Prepare enforced Linux network isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true; then
            sudo tee /etc/apparmor.d/tidy-test-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tidy-test-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/tidy-test-bwrap
          fi
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Prepare selected host and this commit's native artifact
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          chmod +x .test-artifacts/ci-native/packages/linux-x64-gnu/occipital
          node scripts/test/prepare.mjs --pi-version "$PI_VERSION" --integration --native-artifact "$GITHUB_WORKSPACE/.test-artifacts/ci-native" --output "$RUNNER_TEMP/extension-inputs"
      - name: Strict selected-host types
        run: node scripts/test/run.mjs --inputs "$RUNNER_TEMP/extension-inputs/inputs.json" --suite check --network-isolated
      - name: Unit, actual-SDK and GC regressions
        timeout-minutes: 5
        run: node scripts/test/run.mjs --inputs "$RUNNER_TEMP/extension-inputs/inputs.json" --suite unit --network-isolated
      - name: Inert native packaging and release regressions
        if: matrix.pi == '1.0.0'
        run: node scripts/test/run.mjs --inputs "$RUNNER_TEMP/extension-inputs/inputs.json" --suite native-release --network-isolated

  terminal:
    needs: [version, native-linux, scope]
    if: needs.scope.outputs.full == 'true' && needs.version.outputs.product != 'occipital'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.compatibility_profiles) }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.scope.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node }}
      - uses: actions/cache@v6.1.0
        with:
          path: ${{ runner.temp }}/terminal-inputs/environment/cache/npm/_cacache
          key: hermetic-npm-inputs-${{ runner.os }}-${{ runner.arch }}-pi-${{ matrix.pi }}-${{ hashFiles('package-lock.json', 'tests/fixtures/integration-profile/package-lock.json') }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: occipital-v${{ needs.version.outputs.daemon_version }}-linux-x64-gnu
          path: .test-artifacts/ci-native
      - name: Prepare enforced Linux network isolation
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          if ! /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true; then
            sudo tee /etc/apparmor.d/tidy-test-bwrap >/dev/null <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile tidy-test-bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
            sudo apparmor_parser -r /etc/apparmor.d/tidy-test-bwrap
          fi
          /usr/bin/bwrap --unshare-user --unshare-net --ro-bind / / -- /usr/bin/true
      - name: Prepare fixed isolated Subconscious host prerequisite
        run: |
          mkdir -p "$RUNNER_TEMP/shared-host"
          curl --fail --location --output "$RUNNER_TEMP/shared-host/host.zip" \
            https://github.com/cortexkit/subconscious/releases/download/subc-core-v0.20.83/ck-subc-linux-x64.zip
          printf '%s  %s\n' c905fd8c5eba045c38fb61dd0c6c0ffc8254ae2cb0be50ef1017cde5470e62c4 "$RUNNER_TEMP/shared-host/host.zip" | sha256sum --check
          unzip -j "$RUNNER_TEMP/shared-host/host.zip" ck-subc -d "$RUNNER_TEMP/shared-host"
          chmod 700 "$RUNNER_TEMP/shared-host/ck-subc"
      - name: Prepare selected host, locked integration and same-commit native inputs
        env:
          PI_VERSION: ${{ matrix.pi }}
        run: |
          chmod +x .test-artifacts/ci-native/packages/linux-x64-gnu/occipital
          node scripts/test/prepare.mjs --pi-version "$PI_VERSION" --integration \
            --native-artifact "$GITHUB_WORKSPACE/.test-artifacts/ci-native" \
            --shared-host "$RUNNER_TEMP/shared-host/ck-subc" --output "$RUNNER_TEMP/terminal-inputs"
      - name: Full physical CLI and replay (full compatibility or extension release)
        run: node scripts/test/run.mjs --inputs "$RUNNER_TEMP/terminal-inputs/inputs.json" --suite terminal --network-isolated
      - name: Physical syntax CLI and replay using this commit's native artifact
        run: node scripts/test/run.mjs --inputs "$RUNNER_TEMP/terminal-inputs/inputs.json" --suite syntax-terminal --network-isolated

  release-occipital:
    needs: [version, scope, native-plan, native-linux, native-platforms, consumer-linux, affected]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
    permissions:
      contents: write
    uses: ./.github/workflows/occipital-release.yml
    with:
      tag: ${{ github.ref_name }}
      targets: ${{ needs.native-plan.outputs.targets }}

  publish-occipital-npm:
    needs: [scope, native-plan, release-occipital]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/occipital-npm-publish.yml
    with:
      tag: ${{ github.ref_name }}
      source-ref: ${{ needs.scope.outputs.head }}
      targets: ${{ needs.native-plan.outputs.targets }}

  extension-package:
    needs: [version, native-plan, native-linux, native-platforms, consumer-linux, extension, terminal]
    if: needs.version.outputs.product == 'pi-tidy-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.ref }}
      DAEMON_TAG: ${{ needs.version.outputs.daemon_tag }}
      SOURCE_COMMIT: ${{ github.sha }}
      NATIVE_TARGETS: ${{ needs.native-plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '26.7.0'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: occipital-v${{ needs.version.outputs.daemon_version }}-*
          path: .test-artifacts/extension-release/native-ci
      - name: Fetch the selected completed public Occipital release
        run: |
          mkdir -p .test-artifacts/extension-release/public
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DAEMON_TAG" > .test-artifacts/extension-release/public/release.json
          gh release download "$DAEMON_TAG" --repo "$GITHUB_REPOSITORY" --dir .test-artifacts/extension-release/public
      # Identical native input is not inferred from Git paths: compare all six raw binaries.
      # A changed daemon is normal on branches, but must be released before this extension tag.
      - name: Admit current native bytes, public release and required npm payloads
        run: |
          node scripts/release/extension-release.mjs "$RELEASE_REF" \
            .test-artifacts/extension-release/native-ci .test-artifacts/extension-release/public \
            .test-artifacts/extension-release/prepared "$NATIVE_TARGETS"
      - name: Pack the admitted extension without publishing
        run: |
          npm pack ./.test-artifacts/extension-release/prepared/extension --ignore-scripts \
            --pack-destination .test-artifacts/extension-release/prepared
      # Future extension npm publication: intentionally disabled.
      # - name: Publish the admitted pi-tidy-ui package
      #   run: npm publish .test-artifacts/extension-release/prepared/pi-tidy-ui-*.tgz --access public --provenance --ignore-scripts
