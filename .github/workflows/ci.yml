name: CI

on:
  push:
    branches: [main]
    tags: ['pi-tidy-ui-v*', 'occipital-v*']
  pull_request:
  workflow_dispatch:
    inputs:
      clean-native-build:
        description: 'Build every native target without restoring Cargo outputs (reproducibility control)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.version.outputs.product }}
      version: ${{ steps.version.outputs.version }}
      daemon_version: ${{ steps.version.outputs.daemon_version }}
      daemon_tag: ${{ steps.version.outputs.daemon_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The nearest daemon version comes from ancestry, not registry/latest.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/release/version.mjs --resolve "$RELEASE_REF"
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12

  native:
    needs: version
    uses: ./.github/workflows/occipital.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.version.outputs.daemon_version }}
      clean-build: ${{ inputs.clean-native-build || false }}

  extension:
    needs: version
    if: needs.version.outputs.product != 'occipital'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Assert selected Node runtime
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: node -e 'if (process.version !== "v" + process.env.EXPECTED_NODE) throw new Error(process.version)'
      - run: npm ci
      - run: npm run check
      - name: Unit, actual-SDK and GC regressions
        timeout-minutes: 5
        env:
          TERM: xterm-256color
          COLORTERM: truecolor
        run: node --expose-gc --test --test-concurrency=2 tests/*.test.ts
      - name: Inert native packaging and release regressions
        run: npm run test:native-release
      # Real release packages are generated only after all platform/CLI and delivery gates.
      - name: Pack development extension without publishing
        if: needs.version.outputs.product != 'pi-tidy-ui'
        run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.product != 'pi-tidy-ui'
        with:
          name: extension-${{ needs.version.outputs.version }}-node-${{ matrix.node }}
          path: pi-tidy-ui-*.tgz
          if-no-files-found: error

  terminal:
    needs: [version, native]
    if: needs.version.outputs.product != 'occipital'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19.0', '26.7.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: occipital-v${{ needs.version.outputs.daemon_version }}-linux-x64-gnu
          path: .test-artifacts/ci-native
      - name: Restore raw executable permissions
        env:
          DAEMON_VERSION: ${{ needs.version.outputs.daemon_version }}
        run: chmod +x ".test-artifacts/ci-native/assets/occipital-v$DAEMON_VERSION-linux-x64-gnu"
      - name: Full physical CLI and replay (extension release only)
        if: needs.version.outputs.product == 'pi-tidy-ui'
        run: npm run test:terminal
      - name: Physical syntax CLI and replay using this commit's native artifact
        env:
          OCCIPITAL_TEST_BIN: .test-artifacts/ci-native/assets/occipital-v${{ needs.version.outputs.daemon_version }}-linux-x64-gnu
        run: npm run test:syntax-terminal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: terminal-failure-node-${{ matrix.node }}
          path: .test-artifacts/terminal-*/
          include-hidden-files: true
          if-no-files-found: ignore

  release-occipital:
    needs: [version, native]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
    permissions:
      contents: write
    uses: ./.github/workflows/occipital-release.yml
    with:
      tag: ${{ github.ref_name }}

  extension-package:
    needs: [version, native, extension, terminal]
    if: needs.version.outputs.product == 'pi-tidy-ui'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.ref }}
      DAEMON_TAG: ${{ needs.version.outputs.daemon_tag }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '26.7.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: occipital-v${{ needs.version.outputs.daemon_version }}-*
          path: .test-artifacts/extension-release/native-ci
      - name: Fetch the selected completed public Occipital release
        run: |
          mkdir -p .test-artifacts/extension-release/public
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DAEMON_TAG" > .test-artifacts/extension-release/public/release.json
          gh release download "$DAEMON_TAG" --repo "$GITHUB_REPOSITORY" --dir .test-artifacts/extension-release/public
      # Identical native input is not inferred from Git paths: compare all six raw binaries.
      # A changed daemon is normal on branches, but must be released before this extension tag.
      - name: Admit current native bytes, public release and all six npm payloads
        run: |
          node scripts/release/extension-release.mjs "$RELEASE_REF" \
            .test-artifacts/extension-release/native-ci .test-artifacts/extension-release/public \
            .test-artifacts/extension-release/prepared
      - name: Pack the admitted extension without publishing
        run: |
          npm pack ./.test-artifacts/extension-release/prepared/extension --ignore-scripts \
            --pack-destination .test-artifacts/extension-release/prepared
      - uses: actions/upload-artifact@v4
        with:
          name: extension-${{ needs.version.outputs.version }}-release
          path: |
            .test-artifacts/extension-release/prepared/pi-tidy-ui-*.tgz
            .test-artifacts/extension-release/prepared/plan.json
          include-hidden-files: true
          if-no-files-found: error
