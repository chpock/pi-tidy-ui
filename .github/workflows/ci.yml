name: CI
run-name: ${{ github.event_name == 'schedule' && 'Nightly latest-Pi compatibility' || 'Complete CI' }} — ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['pi-tidy-ui-v*', 'occipital-v*']
  pull_request:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      clean-native-build:
        description: 'Build every native target without restoring Cargo outputs (reproducibility control)'
        type: boolean
        default: false

permissions:
  contents: read

# Nightly compatibility must never cancel or replace the ordinary commit result.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'nightly-latest' || 'complete-ci' }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      product: ${{ steps.version.outputs.product }}
      version: ${{ steps.version.outputs.version }}
      daemon_version: ${{ steps.version.outputs.daemon_version }}
      daemon_tag: ${{ steps.version.outputs.daemon_tag }}
      plan: ${{ steps.plan.outputs.plan }}
      source: ${{ steps.plan.outputs.source }}
      kind: ${{ steps.plan.outputs.kind }}
      profiles: ${{ steps.plan.outputs.profiles }}
      cli_profiles: ${{ steps.plan.outputs.cli_profiles }}
      delivery_profiles: ${{ steps.plan.outputs.delivery_profiles }}
      daemon_profiles: ${{ steps.plan.outputs.daemon_profiles }}
      host: ${{ steps.plan.outputs.host }}
      remaining: ${{ steps.plan.outputs.remaining }}
      host_consumers: ${{ steps.plan.outputs.host_consumers }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The nearest daemon version comes from ancestry, not registry/latest.
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: node scripts/release/version.mjs --resolve "$RELEASE_REF"
      - name: Validate automatic native npm version before building
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import {npmReleaseTag} from './scripts/release/version.mjs';
          npmReleaseTag(process.env.RELEASE_REF.slice('refs/tags/'.length));
          JS
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12

      - name: Plan the complete fixed event obligations
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WINDOWS_ARM64: ${{ vars.CI_WINDOWS_ARM64 || 'false' }}
        run: |
          node --input-type=module <<'JS'
          import {appendFileSync} from 'node:fs';
          import {buildCIPlan} from './scripts/test/ci-plan.mjs';
          if (!['true','false'].includes(process.env.WINDOWS_ARM64)) throw new Error('CI_WINDOWS_ARM64 must be true or false');
          const plan = await buildCIPlan({eventName:process.env.EVENT_NAME,ref:process.env.EVENT_REF,sha:process.env.SOURCE_SHA,windowsArm64:process.env.WINDOWS_ARM64 === 'true'});
          const values = {plan:JSON.stringify(plan),source:plan.sourceRef,kind:plan.kind,
            profiles:JSON.stringify({include:plan.profiles}),cli_profiles:JSON.stringify({include:plan.cliProfiles}),delivery_profiles:JSON.stringify({include:plan.deliveryProfiles}),
            daemon_profiles:JSON.stringify({include:plan.daemonRegressionProfiles}),
            host:JSON.stringify(plan.native.host),remaining:JSON.stringify(plan.native.remaining),host_consumers:JSON.stringify(plan.native.hostConsumers),targets:JSON.stringify(plan.native.targets)};
          for (const [key,value] of Object.entries(values)) appendFileSync(process.env.GITHUB_OUTPUT,key + '=' + value + '\n');
          console.log('Complete fixed CI plan: ' + JSON.stringify(plan));
          JS

  native-linux:
    name: ${{ github.event_name == 'schedule' && 'Nightly helper' || 'Complete native Linux' }}
    needs: metadata
    uses: ./.github/workflows/occipital.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.metadata.outputs.daemon_version }}
      source-ref: ${{ needs.metadata.outputs.source }}
      clean-build: ${{ inputs.clean-native-build || false }}
      platforms: ${{ needs.metadata.outputs.host }}

  native-platforms:
    needs: metadata
    if: fromJSON(needs.metadata.outputs.plan).requiredBranches.nativeRemaining
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.remaining) }}
    uses: ./.github/workflows/occipital-platform.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.metadata.outputs.daemon_version }}
      source-ref: ${{ needs.metadata.outputs.source }}
      clean-build: ${{ inputs.clean-native-build || false }}
      platform: ${{ toJSON(matrix) }}
      consumer-platforms: ${{ toJSON(matrix.consumerMatrix) }}

  consumer-linux:
    needs: [metadata, native-linux]
    if: fromJSON(needs.metadata.outputs.plan).requiredBranches.nativeHostConsumers
    uses: ./.github/workflows/occipital-consumer.yml
    with:
      release-ref: ${{ github.ref }}
      version: ${{ needs.metadata.outputs.daemon_version }}
      source-ref: ${{ needs.metadata.outputs.source }}
      platforms: ${{ needs.metadata.outputs.host_consumers }}

  delivery:
    name: Delivery Node ${{ matrix.node }}
    needs: metadata
    if: fromJSON(needs.metadata.outputs.plan).requiredBranches.delivery
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.delivery_profiles) }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      layer: delivery
      source-ref: ${{ needs.metadata.outputs.source }}
      node: ${{ matrix.node }}
      pi: ${{ matrix.pi }}
      daemon-version: ${{ needs.metadata.outputs.daemon_version }}
      nightly: ${{ needs.metadata.outputs.kind == 'nightly' }}

  sdk:
    name: ${{ github.event_name == 'schedule' && 'Nightly' || 'Complete' }} SDK Node ${{ matrix.node }} Pi ${{ matrix.pi }}
    needs: [metadata, native-linux]
    if: fromJSON(needs.metadata.outputs.plan).requiredBranches.sdk
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.profiles) }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      layer: node
      source-ref: ${{ needs.metadata.outputs.source }}
      node: ${{ matrix.node }}
      pi: ${{ matrix.pi }}
      daemon-version: ${{ needs.metadata.outputs.daemon_version }}
      nightly: ${{ needs.metadata.outputs.kind == 'nightly' }}

  cli:
    name: ${{ github.event_name == 'schedule' && 'Nightly' || 'Complete' }} CLI Node ${{ matrix.node }} Pi ${{ matrix.pi }} shard ${{ matrix.shard }}
    needs: [metadata, native-linux]
    if: fromJSON(needs.metadata.outputs.plan).requiredBranches.cli
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.cli_profiles) }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      layer: cli
      source-ref: ${{ needs.metadata.outputs.source }}
      node: ${{ matrix.node }}
      pi: ${{ matrix.pi }}
      daemon-version: ${{ needs.metadata.outputs.daemon_version }}
      nightly: ${{ needs.metadata.outputs.kind == 'nightly' }}
      shard: ${{ matrix.shard }}

  daemon-regressions:
    name: Daemon regressions Node ${{ matrix.node }}
    needs: [metadata, native-linux]
    if: fromJSON(needs.metadata.outputs.plan).requiredBranches.daemonRegressions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.daemon_profiles) }}
    uses: ./.github/workflows/ci-checks.yml
    with:
      layer: daemon
      source-ref: ${{ needs.metadata.outputs.source }}
      node: ${{ matrix.node }}
      pi: ${{ matrix.pi }}
      daemon-version: ${{ needs.metadata.outputs.daemon_version }}

  release-occipital:
    needs: [metadata, native-linux, native-platforms, consumer-linux, delivery, daemon-regressions]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
    permissions:
      contents: write
    uses: ./.github/workflows/occipital-release.yml
    with:
      tag: ${{ github.ref_name }}
      targets: ${{ needs.metadata.outputs.targets }}

  publish-occipital-npm:
    needs: [metadata, release-occipital]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/occipital-v')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/occipital-npm-publish.yml
    with:
      tag: ${{ github.ref_name }}
      source-ref: ${{ needs.metadata.outputs.source }}
      targets: ${{ needs.metadata.outputs.targets }}

  extension-package:
    needs: [metadata, native-linux, native-platforms, consumer-linux, delivery, sdk, cli]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/pi-tidy-ui-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_REF: ${{ github.ref }}
      DAEMON_TAG: ${{ needs.metadata.outputs.daemon_tag }}
      SOURCE_COMMIT: ${{ github.sha }}
      NATIVE_TARGETS: ${{ needs.metadata.outputs.targets }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '26.7.0'
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: occipital-v${{ needs.metadata.outputs.daemon_version }}-*
          path: .test-artifacts/extension-release/native-ci
      - name: Fetch the selected completed public Occipital release
        run: |
          mkdir -p .test-artifacts/extension-release/public
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$DAEMON_TAG" > .test-artifacts/extension-release/public/release.json
          gh release download "$DAEMON_TAG" --repo "$GITHUB_REPOSITORY" --dir .test-artifacts/extension-release/public
      # Identical native input is not inferred from Git paths: compare every enabled raw binary.
      # A changed daemon is normal on branches, but must be released before this extension tag.
      - name: Admit current native bytes, public release and required npm payloads
        run: |
          node scripts/release/extension-release.mjs "$RELEASE_REF" \
            .test-artifacts/extension-release/native-ci .test-artifacts/extension-release/public \
            .test-artifacts/extension-release/prepared "$NATIVE_TARGETS"
      - name: Pack the admitted extension without publishing
        run: |
          npm pack ./.test-artifacts/extension-release/prepared/extension --ignore-scripts \
            --pack-destination .test-artifacts/extension-release/prepared
      # Future extension npm publication: intentionally disabled.
      # - name: Publish the admitted pi-tidy-ui package
      #   run: npm publish .test-artifacts/extension-release/prepared/pi-tidy-ui-*.tgz --access public --provenance --ignore-scripts

  result:
    name: ${{ github.event_name == 'schedule' && 'Nightly latest-Pi result' || 'Complete CI result' }}
    if: always()
    needs: [metadata, native-linux, native-platforms, consumer-linux, delivery, sdk, cli, daemon-regressions, release-occipital, publish-occipital-npm, extension-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          package-manager-cache: false
          node-version: '22.19.0'
      - name: Require every planned branch, including every CLI partition
        env:
          CI_PLAN: ${{ needs.metadata.outputs.plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module <<'JS'
          import {validateCIResults} from './scripts/test/ci-plan.mjs';
          const needs = JSON.parse(process.env.CI_NEEDS);
          if (needs.metadata.result !== 'success') throw new Error('CI metadata or latest-version selection failed');
          const plan = JSON.parse(process.env.CI_PLAN);
          const mapping = {nativeHost:'native-linux',nativeRemaining:'native-platforms',nativeHostConsumers:'consumer-linux',delivery:'delivery',sdk:'sdk',cli:'cli',daemonRegressions:'daemon-regressions',daemonRelease:'release-occipital',daemonNpm:'publish-occipital-npm',preparedPack:'extension-package'};
          // Public-consumer checks are a mandatory part of the existing extension-tag platform consumers.
          const statuses = Object.fromEntries(Object.entries(mapping).map(([branch,job]) => [branch,needs[job].result]));
          statuses.publishedConsumer = plan.publishedConsumer ? needs['consumer-linux'].result : 'skipped';
          console.log(JSON.stringify({kind:plan.kind,source:plan.sourceRef,piSelection:plan.piSelection,statuses}));
          if (!validateCIResults(plan,statuses)) throw new Error('One or more required CI branches failed, were cancelled or were skipped');
          JS
